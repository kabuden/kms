# Render Blueprint — 주식 예측 멀티에이전트 웹 대시보드
# 이 저장소를 Render에 연결하면 자동 인식됩니다.
# (저장소 루트는 Quartz 사이트지만, 아래 서비스는 stock-analyzer 폴더만 사용합니다.)
#
# 무료 등급(free) 특성:
#  - 15분간 요청이 없으면 잠자기 → 다음 접속 시 수십 초 지연 후 깨어남
#    (외부 모니터링 핑(UptimeRobot 등)으로 5분마다 깨워두면 대기 없음)
#  - 디스크가 비휘발성이 아니라 재시작/재배포 시 학습 DB가 초기화됨
#    → SA_SEED_CYCLES 로 첫 화면에 학습 곡선(합성)을 채워 둠
#
# ── 학습 DB를 GitHub에 영구 보관(무료) ─────────────────────────
# SA_GITHUB_TOKEN(Contents 읽기/쓰기 권한 PAT)을 설정하면, 사이클 ④마다
# 학습 DB 전체를 gzip 스냅샷으로 별도 데이터 브랜치(sa-data)에 커밋하고,
# 콜드 스타트 때 자동 복원해 학습을 그대로 이어갑니다(유료 디스크 불필요).
# ⚠️ 토큰은 비밀값이므로 이 파일에 적지 말고 Render 대시보드 > Environment
#    에서 SA_GITHUB_TOKEN 으로 추가하세요. 데이터는 배포 브랜치가 아닌
#    sa-data 브랜치로 가므로 재배포 루프가 생기지 않습니다.
services:
  - type: web
    name: stock-analyzer
    runtime: python
    rootDir: stock-analyzer
    plan: free
    region: singapore            # 한국에서 지연이 가장 낮은 무료 리전
    # stdlib만으로 동작하므로 별도 의존성 설치 불필요(빌드 빠름).
    # 실데이터(yfinance)·LLM을 켜려면: pip install -r requirements.txt 로 교체
    buildCommand: "python -m pip install --upgrade pip"
    startCommand: "python run.py serve"
    healthCheckPath: /
    envVars:
      - key: SA_OFFLINE          # false: 실시세(Yahoo)+실뉴스(RSS). 모두 stdlib·무키
        value: "false"
      - key: SA_USE_LLM          # 구독형 AI는 코드 호출 불가 → false 유지
        value: "false"
      - key: SA_SEED_CYCLES      # 콜드 스타트 시 실제 과거 시세로 채울 사이클 수
        value: "20"              # (과거 뉴스는 RSS로 불가 → 가격 기반으로 시드)
      - key: SA_MIN_CYCLES
        value: "10"
      - key: SA_MIN_ACCURACY
        value: "0.58"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 학습 DB 영구 보관용. 토큰은 대시보드에서 비밀값으로 추가하세요.
      # - key: SA_GITHUB_TOKEN     # ← Render 대시보드 Environment 에 직접 입력
      - key: SA_GITHUB_DATA_BRANCH  # 데이터 전용 브랜치(자동 생성, 배포와 분리)
        value: "sa-data"
      # ── LLM 토론 하네스(강세·약세·심판 + 회고) — Groq 백엔드 ──
      # 휴리스틱 앙상블 위에 LLM 토론을 얹어 예측을 교정한다. Groq(Llama)는
      # 매우 저렴(월 $1~3 수준)해 구독형 AI보다 운영비가 낮다. 키는 비밀값이라
      # 이 파일에 적지 말고 Render Environment 에 SA_GROQ_API_KEY 로 추가하세요.
      - key: SA_USE_HARNESS      # true 로 켜고 SA_GROQ_API_KEY 를 넣으면 활성
        value: "false"
      # - key: SA_GROQ_API_KEY   # ← Render 대시보드 Environment 에 직접 입력
      - key: SA_GROQ_MODEL       # Groq 모델 id
        value: "llama-3.3-70b-versatile"
      - key: SA_HARNESS_POINTS   # 토론 돌릴 시점(3=공식만 → 비용 1/3). "1,2,3" 가능
        value: "3"

# ── 대안: 유료 영구 디스크 ──────────────────────────────────
# GitHub 스냅샷 대신 영구 디스크를 붙이고 SA_DB_DIR 로 경로를 지정해도 됩니다.
#    disk:
#      name: stock-data
#      mountPath: /var/data
#      sizeGB: 1
