# Render Blueprint — 주식 예측 멀티에이전트 웹 대시보드
# 이 저장소를 Render에 연결하면 자동 인식됩니다.
# (저장소 루트는 Quartz 사이트지만, 아래 서비스는 stock-analyzer 폴더만 사용합니다.)
#
# 무료 등급(free) 특성:
#  - 15분간 요청이 없으면 잠자기 → 다음 접속 시 수십 초 지연 후 깨어남
#  - 디스크가 비휘발성이 아니라 재시작/재배포 시 학습 DB가 초기화됨
#    → SA_SEED_CYCLES 로 첫 화면에 학습 곡선(합성)을 채워 둠
#  - 학습 누적을 영구 보관하려면 유료 디스크 또는 외부 DB가 필요(아래 주석 참고)
services:
  - type: web
    name: stock-analyzer
    runtime: python
    rootDir: stock-analyzer
    plan: free
    region: singapore            # 한국에서 지연이 가장 낮은 무료 리전
    # stdlib만으로 동작하므로 별도 의존성 설치 불필요(빌드 빠름).
    # 실데이터(yfinance)·LLM을 켜려면: pip install -r requirements.txt 로 교체
    buildCommand: "python -m pip install --upgrade pip"
    startCommand: "python run.py serve"
    healthCheckPath: /
    envVars:
      - key: SA_OFFLINE          # true: 합성 데이터로 무키·무료 운영
        value: "true"
      - key: SA_USE_LLM          # 구독형 AI는 코드 호출 불가 → false 유지
        value: "false"
      - key: SA_SEED_CYCLES      # 콜드 스타트 시 채워 둘 합성 학습 사이클 수
        value: "20"
      - key: SA_MIN_CYCLES
        value: "10"
      - key: SA_MIN_ACCURACY
        value: "0.58"
      - key: PYTHON_VERSION
        value: "3.11.9"

# ── 학습 영구 보관(선택, 유료) ──────────────────────────────
# 무료 등급은 디스크가 휘발성입니다. 누적 학습을 유지하려면 아래처럼
# 영구 디스크를 붙이고 SA_DB_DIR 같은 환경변수로 DB 경로를 디스크로 지정하세요.
#    disk:
#      name: stock-data
#      mountPath: /var/data
#      sizeGB: 1
